    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #6da2a6;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents stray scrollbars from edge-to-edge elements */
            font-family: sans-serif;
        }

        /* The canvas now takes up 100% of the screen dimensions */
        .collage-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .collage-canvas a.no-shake:hover {
            animation: none;
        }

        /* Target the link wrappers instead of the images directly */
        .collage-canvas a {
            position: absolute;
            display: inline-block;
            transition: transform 0.1s ease;
        }

        .collage-canvas img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            user-select: none;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15)); 
        }

        /* --- Hover Shake Animation --- */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-2px, 1px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .collage-canvas a:hover {
            animation: shake 0.3s infinite linear;
            cursor: pointer;
        }

        /* --- Individual Positions --- */
        .scallop     { width: 13%; top: 3%;   left: 4%; }

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSynthSound(leftPercent, topPercent) {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const minHz = 220; 
            const maxHz = 784; 
            const frequency = minHz + ((leftPercent / 100) * (maxHz - minHz));
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);

            const minDuration = 0.1;
            const maxDuration = 0.4;
            const duration = minDuration + ((topPercent / 100) * (maxDuration - minDuration));

            oscillator.type = 'triangle';

            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }
